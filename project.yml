name: MeetingNotes
options:
  bundleIdPrefix: com.meetingnotes
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Dev builds are unsigned/local; Developer ID signing + notarization are a
    # documented manual step (see README "Signing & notarization").
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

packages:
  SharedKit:
    path: .

targets:
  MeetingNotes-Mac:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac
      - path: Apps/Shared
    dependencies:
      - package: SharedKit
        product: SharedKit
      - package: SharedKit
        product: Diagnostics
      - package: SharedKit
        product: SearchIndex
    settings:
      base:
        PRODUCT_NAME: MeetingNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.meetingnotes.mac
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "MeetingNotes records your microphone to capture meeting audio locally on this Mac."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Local, private meeting recorder."
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: MeetingNotes
        # Non-sandboxed (Developer ID, not App Store): the pipeline execs
        # user-installed CLIs (claude, whisper, ffmpeg) which the sandbox forbids.
        ENABLE_APP_SANDBOX: "NO"

  MeetingNotes-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared/Localizable.xcstrings
    dependencies:
      - package: SharedKit
        product: SharedKit
      - package: SharedKit
        product: SearchIndex
    settings:
      base:
        PRODUCT_NAME: MeetingNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.meetingnotes.ios
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: MeetingNotes
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "MeetingNotes records your microphone to capture meeting audio."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "MeetingNotes can tag a recording with where it was made."
        TARGETED_DEVICE_FAMILY: "1,2"

  MeetingNotes-Watch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/Watch
    dependencies:
      - package: SharedKit
        product: SharedKit
    settings:
      base:
        PRODUCT_NAME: MeetingNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.meetingnotes.watch
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: MeetingNotes
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "MeetingNotes records your microphone to capture meeting audio."
        INFOPLIST_KEY_WKApplication: "YES"
