name: Test

# Reusable: unit tests via `swift test`. Triggers are owned by the root ci.yml.
on:
  workflow_call:

jobs:
  unit-tests:
    name: Unit tests (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: swift test
        run: swift test
