name: CI

# Single entry point that owns all triggers + concurrency and delegates the work
# to reusable workflows (test.yml / build.yml / release.yml). Running CI on pushes
# to main + tags + pull requests (but not other branch pushes) means each commit
# gets exactly one run - a PR-branch push no longer fires push *and* pull_request.
on:
  push:
    branches: [main] # merges to main only (not every branch push)
    tags: ["v*"] # release tags
  pull_request: # all PRs (tested against the merge ref)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded CI runs, but never cancel an in-flight release.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: [test, build] # gate: only ship a tag if CI is green
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write # release.yml publishes a Release + pushes the cask bump
    secrets: inherit # pass the signing/notary secrets down
    uses: ./.github/workflows/release.yml
