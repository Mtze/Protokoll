name: Pages

# Deploy the static user-docs site (site/) to GitHub Pages. Separate from ci.yml:
# different trigger, ubuntu runner, and Pages/OIDC permissions. Do NOT add this to
# branch-protection required checks - it has no pull_request trigger.
#
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub
# Actions" (else the first deploy 404s; just re-run after enabling).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
